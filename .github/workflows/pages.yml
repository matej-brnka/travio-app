name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/presentation/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build presentation (slides -> prezentace.html)
        working-directory: docs/presentation
        run: node build.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/presentation/prezentace.html _site/index.html
          cp docs/presentation/styles.css _site/
          cp -r docs/presentation/assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
